name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python checks and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: gateway

    env:
      ENVIRONMENT: test
      JWT_SECRET: ci-only-secret-not-for-production-0123456789
      DATABASE_URL: postgresql+asyncpg://gateway:ci_password@127.0.0.1:5432/gateway_test
      REDIS_URL: redis://127.0.0.1:6379/15
      TEST_DATABASE_URL: postgresql+asyncpg://gateway:ci_password@127.0.0.1:5432/gateway_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      REQUIRE_INFRA: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gateway/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip check

      - name: Check lint
        run: >
          python -m ruff check
          --config pyproject.toml
          . ../services

      - name: Check formatting
        run: >
          python -m ruff format
          --check
          --config pyproject.toml
          . ../services

      - name: Check types
        run: python -m mypy app

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run tests with coverage
        run: >
          python -m pytest
          --strict-markers
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=test-results.xml

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            gateway/coverage.xml
            gateway/test-results.xml
          if-no-files-found: ignore
          retention-days: 14
